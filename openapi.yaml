    # --- Formes composites definies dans src/api/*.ts (pas dans src/domain),
    # --- reconstruites ici par composition sur les $ref ci-dessus pour rester
    # --- DRY. Voir SPEC.md pour la justification de chacune.
    TeamMember:
      description: "Membre affiche dans l'onglet Equipe (`teamMemberSchema`, src/api/memberships.ts) : appartenance + profil resume."
      allOf:
        - { $ref: "#/components/schemas/Membership" }
        - type: object
          properties:
            user: { $ref: "#/components/schemas/UserSummary" }
          required: [user]

    AnnouncementWithAuthor:
      description: "Annonce + auteur resolu (`announcementWithAuthorSchema`, src/api/announcements.ts)."
      allOf:
        - { $ref: "#/components/schemas/Announcement" }
        - type: object
          properties:
            author: { $ref: "#/components/schemas/UserSummary" }
          required: [author]

    CommentWithAuthor:
      description: "Commentaire + auteur resolu (`commentWithAuthorSchema`, src/api/comments.ts)."
      allOf:
        - { $ref: "#/components/schemas/Comment" }
        - type: object
          properties:
            author: { $ref: "#/components/schemas/UserSummary" }
          required: [author]

    UserProjectsResponse:
      description: "R-V4 (`userProjectsResponseSchema`, src/api/users.ts)."
      type: object
      properties:
        created:
          {
            type: array,
            items: { $ref: "#/components/schemas/ProjectSummary" },
          }
        collaborations:
          {
            type: array,
            items: { $ref: "#/components/schemas/ProjectSummary" },
          }
        privateProjectsCount: { type: integer, minimum: 0 }
      required: [created, collaborations, privateProjectsCount]
      additionalProperties: false

    HighfiveToggleResponse:
      description: "R-H1/R-X2 (`highfiveToggleResponseSchema`, src/api/highfives.ts)."
      type: object
      properties:
        given: { type: boolean }
