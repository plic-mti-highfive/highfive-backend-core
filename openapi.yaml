      required: [given, highfiveCount]
      additionalProperties: false

    AvatarResponse:
      description: "Reponse de `POST /me/avatar` (schema anonyme, src/api/files.ts)."
      type: object
      properties:
        avatar: { type: string, format: uri }
      required: [avatar]
      additionalProperties: false

    ProjectDeleteInput:
      description: "R-PR7 — confirmation nominative (schema anonyme, src/api/projects.ts)."
      type: object
      properties:
        confirmTitle:
          type: string
          description: Doit correspondre exactement au titre courant du projet.
      required: [confirmTitle]
      additionalProperties: false

    AdminReasonInput:
      description: "Motif optionnel d'une action d'administration (schema anonyme, src/api/admin.ts). Recommande de le rendre obligatoire cote backend pour R-S3 (motif toujours notifie) — voir SPEC.md."
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
      additionalProperties: false
