services:
  backend_core:
    build:
      context: .
      # Stage `builder` (et non `runner`) : il contient les devDependencies et
      # le nest CLI, indispensables au watch ci-dessous. Le stage `runner` ne
      # sert que l'image de production, qui execute dist/ et ignorerait les
      # volumes montes plus bas — le code local ne serait alors jamais relu.
      target: builder
      secrets:
        - github_token
    # Compile les sources montees au demarrage. Sans ca, le conteneur executait
    # le `dist` fige dans l'image : un `up -d` sans `--build` faisait tourner
    # silencieusement une version perimee du backend, sans le moindre indice.
    # Un `docker compose restart backend_core` suffit desormais a prendre en
    # compte une modification (les bind mounts ne remontant pas d'evenement
    # inotify, le watch ne se declenche pas tout seul sous Windows/macOS).
    command: pnpm start:dev
    container_name: dev_highfive_backend_core
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./src:/app/src
      - ./test:/app/test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Utils
  db:
    image: pgvector/pgvector:pg16
    container_name: dev_highfive_db
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dev_highfive_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: dev_highfive_minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  seeder:
    image: node:22-alpine
    container_name: highfive_seeder
    depends_on:
      backend_core:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    environment:
      API_URL: http://backend_core:${PORT}
    command: node /scripts/seed.mjs
    restart: "no"

volumes:
  pgdata:
  redis_data:
  minio_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
