description: API REST NestJS multi-tenant de HighFive (mise en relation d'étudiants EPITA autour de projets) — identité/auth, gestion de projets/tickets, canvas IA et recherche globale, organisée en bounded contexts DDD.
repo: github.com/plic-mti-highfive/highfive-backend-core
