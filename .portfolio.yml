languages: [TypeScript]
tools: [NestJS, TypeORM, PostgreSQL, BullMQ, Redis, Passport JWT, argon2, Swagger/OpenAPI, class-validator, Vitest, AWS S3 SDK, OpenAI SDK, Docker, Docker Compose, pnpm, GitHub Actions]
skills:
  - API REST NestJS structurée en bounded contexts DDD (Identity, Project Execution, Discovery, Showcase)
  - Authentification JWT (access/refresh) avec hachage argon2 et guards Passport
  - Isolation multi-tenant par middleware/guard (résolution via header X-Tenant-ID, filtrage systématique des repositories par tenant_id)
  - Persistance PostgreSQL via TypeORM (entités, migrations, repository pattern)
  - Intégration IA : génération de tâches à partir d'un canvas de brainstorming via l'API OpenAI, avec dégradation gracieuse si le service n'est pas configuré
  - Événements de domaine découplés (EventEmitter) et préparation de files BullMQ/Redis
  - Documentation API auto-générée avec Swagger/OpenAPI et validation des DTO via class-validator
  - Pipeline CI/Docker multi-stage avec registre npm privé GitHub Packages et rate limiting (throttler, helmet)
